name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Alire
        uses: alire-project/setup-alire@v6

      - name: Select GNAT toolchain
        run: >-
          alr -n toolchain --select
          gnat_native=15.2.1 gprbuild=26.0.1

      - name: Build library
        run: alr -n build

      - name: Run offline tests
        timeout-minutes: 5
        run: alr -n test

      - name: Build ping bot example
        run: alr -n exec -- gprbuild -P examples/ping_bot.gpr -q

  documentation:
    name: Generate API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Alire
        uses: alire-project/setup-alire@v6

      - name: Select GNAT toolchain
        run: >-
          alr -n toolchain --select
          gnat_native=15.2.1 gprbuild=26.0.1

      - name: Build project dependencies
        run: alr -n build

      - name: Install GNATdoc
        run: alr -n install --prefix "$RUNNER_TEMP/gnatdoc" gnatdoc_bin=26.0.0

      - name: Generate HTML documentation
        run: |
          export PATH="$RUNNER_TEMP/gnatdoc/bin:$PATH"
          gnatdoc -P adacord.gpr \
            --backend=html \
            --generate=public \
            --style=gnat \
            --warnings \
            -O docs/generated

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v4
        with:
          name: adacord-api-docs
          path: docs/generated
          if-no-files-found: error

      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/generated

  deploy-pages:
    name: Deploy API documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
