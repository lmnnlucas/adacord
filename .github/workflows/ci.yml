name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Alire
        uses: alire-project/setup-alire@v6

      - name: Select GNAT toolchain
        run: >-
          alr -n toolchain --select
          gnat_native=15.2.1 gprbuild=26.0.1

      - name: Build library
        run: alr -n build

      - name: Run offline tests
        timeout-minutes: 5
        run: alr -n test

      - name: Build ping bot example
        run: alr -n exec -- gprbuild -P examples/ping_bot.gpr -q
